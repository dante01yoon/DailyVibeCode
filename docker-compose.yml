version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: mastra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mastra
      POSTGRES_PASSWORD: mastra
      POSTGRES_DB: mastra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mastra"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

